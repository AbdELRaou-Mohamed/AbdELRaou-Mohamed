<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340">
  <style>
    .mono { font-family: 'Courier New', Consolas, monospace; }
    .l1 { opacity: 0; animation: fadein 0.5s ease forwards 0.3s; }
    .l2 { opacity: 0; animation: fadein 0.5s ease forwards 0.9s; }
    .l3 { opacity: 0; animation: fadein 0.5s ease forwards 1.5s; }
    .l4 { opacity: 0; animation: fadein 0.5s ease forwards 2.1s; }
    .l5 { opacity: 0; animation: fadein 0.5s ease forwards 2.7s; }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes fadein { to { opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6b35" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="900" height="340" rx="14" fill="#0d1117" stroke="#30363d"/>
  <rect width="900" height="340" rx="14" fill="url(#glow)"/>
  <rect width="900" height="40" rx="14" fill="#161b22"/>
  <rect y="26" width="900" height="14" fill="#161b22"/>
  <circle cx="28" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="50" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="72" cy="20" r="6" fill="#58a6ff"/>
  <text x="450" y="25" text-anchor="middle" class="mono" font-size="12" fill="#6e7681">abdelraouf@portfolio: ~/hero</text>

  <text x="40" y="90" class="mono l1" font-size="18" fill="#58a6ff">$ whoami</text>
  <text x="40" y="146" class="mono l2" font-size="46" font-weight="bold" fill="#ff6b35">AbdELRaouf Mohamed</text>
  <text x="40" y="186" class="mono l3" font-size="17" fill="#c9d1d9">&gt; Computer Science Student | C++ | Python | SQL</text>
  <text x="40" y="213" class="mono l3" font-size="14" fill="#6e7681">&gt; First-Year · Future Software Engineer</text>
  <text x="40" y="270" class="mono l4" font-size="18" fill="#58a6ff">$ ./grow</text>
  <text x="40" y="306" class="mono l5" font-size="19" font-weight="bold" fill="#ff6b35">C++ → Python → SQL → Software Engineer<tspan class="cursor" fill="#c9d1d9"> ▌</tspan></text>

  <text x="745" y="265" class="mono" font-size="96" fill="#ffffff" fill-opacity="0.05">&lt;/&gt;</text>
</svg>
